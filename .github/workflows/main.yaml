name: CI

on:
  push:
    branches: [main, develop, devops]
  pull_request:
    branches: [main, develop, devops]

jobs:
  Test_DEV:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout the Repo'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Для кращої роботи SonarCloud

      - name: 'Create env file'
        run: |
          touch .env.test.local
          echo "MONGODB_URL=${{secrets.MONGODB_URL}}" >> .env.test.local
          echo "JWT_ACCESS_SECRET=${{secrets.JWT_ACCESS_SECRET}}" >> .env.test.local
          echo "JWT_REFRESH_SECRET=${{secrets.JWT_REFRESH_SECRET}}" >> .env.test.local
          echo "JWT_RESET_SECRET=${{secrets.JWT_RESET_SECRET}}" >> .env.test.local
          echo "JWT_CONFIRM_SECRET=${{secrets.JWT_CONFIRM_SECRET}}" >> .env.test.local
          echo "JWT_ACCESS_EXPIRES_IN=${{secrets.JWT_ACCESS_EXPIRES_IN}}" >> .env.test.local
          echo "JWT_REFRESH_EXPIRES_IN=${{secrets.JWT_REFRESH_EXPIRES_IN}}" >> .env.test.local
          echo "JWT_RESET_EXPIRES_IN=${{secrets.JWT_RESET_EXPIRES_IN}}" >> .env.test.local
          echo "JWT_CONFIRM_EXPIRES_IN=${{secrets.JWT_CONFIRM_EXPIRES_IN}}" >> .env.test.local
          echo "CLIENT_URL=${{secrets.CLIENT_URL}}" >> .env.test.local
          echo "SERVER_URL=${{secrets.SERVER_URL}}" >> .env.test.local
          echo "SERVER_PORT=${{secrets.SERVER_PORT}}" >> .env.test.local
          echo "MAIL_USER=${{secrets.MAIL_USER}}" >> .env.test.local
          echo "MAIL_PASS=${{secrets.MAIL_PASS}}" >> .env.test.local
          echo "MAIL_FIRSTNAME=${{secrets.MAIL_FIRSTNAME}}" >> .env.test.local
          echo "MAIL_LASTNAME=${{secrets.MAIL_LASTNAME}}" >> .env.test.local
          echo "GMAIL_CLIENT_ID=${{secrets.GMAIL_CLIENT_ID}}" >> .env.test.local
          echo "GMAIL_CLIENT_SECRET=${{secrets.GMAIL_CLIENT_SECRET}}" >> .env.test.local
          echo "GMAIL_REFRESH_TOKEN=${{secrets.GMAIL_REFRESH_TOKEN}}" >> .env.test.local
          echo "GMAIL_REDIRECT_URI=${{secrets.GMAIL_REDIRECT_URI}}" >> .env.test.local
          echo "COOKIE_DOMAIN=${{secrets.COOKIE_DOMAIN}}" >> .env.test.local

      - name: 'Start MongoDB'
        uses: supercharge/mongodb-github-action@1.8.0
        with:
          mongodb-version: latest
          mongodb-port: 27017

      - name: 'Wait for the database to start'
        run: |
          wget -qO- https://raw.githubusercontent.com/eficode/wait-for/$WAIT_FOR_VERSION/wait-for | 
          sh -s -- localhost:27017 -- echo "Database is up"
        env:
          WAIT_FOR_VERSION: 4df3f9262d84cab0039c07bf861045fbb3c20ab7

      - name: 'Install Node.js v.14'
        uses: actions/setup-node@v3
        with:
          node-version: 14

      - name: 'Install dependencies'
        run: npm install

      - name: 'Run Tests'
        run: npm run test
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          MONGODB_URL: mongodb://${{secrets.MONGODB_USER}}:${{secrets.MONGODB_PASS}}@localhost:27017/${{secrets.MONGODB_DB}}?authSource=admin

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
